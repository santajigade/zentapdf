# Tell Bing, Yandex and other IndexNow search engines about all pages after every publish.
name: IndexNow
on:
  push:
    branches: [site]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Hostinger to publish
        run: sleep 120
      - name: Submit URLs
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap-0.xml | sed 's#<loc>##;s#</loc>##' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          body=$(printf '{"host":"zentapdf.com","key":"9462406b2206d2f064e7fd4a0a8cd013","keyLocation":"https://zentapdf.com/9462406b2206d2f064e7fd4a0a8cd013.txt","urlList":%s}' "$urls")
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"

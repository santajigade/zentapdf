# Manual: fetch key pages as Googlebot from outside (status, robots headers, meta robots, canonical).
name: Site health (Googlebot)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in / /merge-pdf/ /compress-pdf/ /guides/ /templates/ /robots.txt /sitemap-index.xml; do
            curl -s -A "Googlebot/2.1 (+http://www.google.com/bot.html)" -D /tmp/h -o /tmp/b -w "%{http_code} %{time_total}s %{size_download}B $u\n" "https://zentapdf.com$u"
            grep -i "x-robots-tag\|^location" /tmp/h || true
            grep -o '<meta name="robots"[^>]*>' /tmp/b | head -1 || true
          done
          echo "== 403 page body"; curl -s -A "Googlebot/2.1 (+http://www.google.com/bot.html)" -D - https://zentapdf.com/ | head -40
          echo "== normal browser"; curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0 Safari/537.36" https://zentapdf.com/

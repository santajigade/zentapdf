# Auto deploy: once a day (08:20 IST, about an hour after the daily guides task) build main, check SEO
# and publish dist/ to the `site` branch. Skips when main has not changed since the last publish.
# Publish now: Actions tab > Deploy > Run workflow (always publishes).
name: Deploy
on:
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if main is already published
        id: check
        run: |
          last=$(git fetch -q origin site --depth 1 && git show FETCH_HEAD:deployed-commit.txt 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$(git rev-parse HEAD)" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Nothing new on main."; fi
      - if: steps.check.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != '1'
        run: npm ci
      - if: steps.check.outputs.skip != '1'
        name: Build and SEO check (stops the deploy if anything fails)
        run: npx astro build && python3 tools/seo-audit.py | tee /tmp/audit.txt && grep -q " 0 issues" /tmp/audit.txt
      - if: steps.check.outputs.skip != '1'
        name: Publish to site branch
        run: bash deploy.sh
      # Pushes made with GITHUB_TOKEN do not start the IndexNow workflow on the site branch, so ping here.
      - if: steps.check.outputs.skip != '1'
        name: IndexNow
        run: |
          sleep 120
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml | sed 's#<loc>##;s#</loc>##' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          body=$(printf '{"host":"zentapdf.com","key":"9462406b2206d2f064e7fd4a0a8cd013","keyLocation":"https://zentapdf.com/9462406b2206d2f064e7fd4a0a8cd013.txt","urlList":%s}' "$urls")
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"

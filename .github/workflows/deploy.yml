# Auto deploy: every push to main builds the site, runs the SEO audit (must be 0 issues)
# and publishes dist/ to the `site` branch, then pings IndexNow with the changed pages.
# Also runs daily at 06:00 IST so the Pinterest feed (/pins/feed.xml) releases the day's pins.
# Publish again by hand: Actions tab > Deploy > Run workflow.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST daily rebuild so the Pinterest feed releases the day's pins
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse pin images from earlier builds
        uses: actions/cache@v4
        with:
          path: .og-cache
          key: og-${{ github.run_id }}
          restore-keys: og-
      - name: Build and SEO check (stops the deploy if anything fails)
        run: npx astro build && python3 tools/seo-audit.py | tee /tmp/audit.txt && grep -q " 0 issues" /tmp/audit.txt
      - name: Give new pages a pin date (tomorrow) and save it
        run: |
          python3 tools/pins/pins.py add-new
          if ! git diff --quiet src/data/pins.json; then
            git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -qm "Pins: schedule new pages" src/data/pins.json
            git push -q origin HEAD:main || echo "pins.json push skipped"
          fi
      - name: Publish to site branch (then IndexNow for changed pages)
        run: bash deploy.sh
